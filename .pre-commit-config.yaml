repos:
  - repo: https://github.com/psf/black
    rev: 26.5.1
    hooks:
      - id: black

  - repo: https://github.com/RobertCraigie/pyright-python
    rev: v1.1.411
    hooks:
      - id: pyright
        files: \.py$
        exclude: ^tests/
        additional_dependencies:
          - pyside6

  - repo: local
    hooks:
      - id: pytest-unit
        name: pytest (unit)
        entry: pytest tests/unit -q
        language: python
        additional_dependencies:
          - pytest
          - pyside6
        pass_filenames: false
        always_run: true
